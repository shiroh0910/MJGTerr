<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>訪問活動サポート</title>
  <meta name="description" content="訪問活動をサポートするためのPWA">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="/pwa-192x192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="src/styles.css">
  <link rel="stylesheet" href="src/export-panel.css">
  <style>
    /* ポップアップ全体のフォントをモダンなシステムフォントに */
    .leaflet-popup-content {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    /* ポップアップボタンの共通スタイル */
    .popup-button {
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin: 2px;
      transition: all 0.2s ease;
      border: none;
      border-radius: 8px;
      color: white;
      white-space: nowrap; /* ボタン内のテキストが改行されないようにする */
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    .popup-button i {
      margin-right: 5px;
    }
    .popup-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }
    /* ボタンの色定義 */
    .button-primary {
      background-color: #007aff; /* より鮮やかな青 */
    }
    .button-secondary {
      background-color: #6c757d; /* グレー */
    }
    .button-danger {
      background-color: #ff3b30; /* より鮮やかな赤 */
    }
    .button-warning {
      background-color: #ff9500; /* より鮮やかなオレンジ */
    }

    /* ポップアップのグラスモーフィズムスタイル */
    .leaflet-popup-content-wrapper {
      background: rgba(255, 255, 255, 0.6); /* 背景を少し明るく */
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(10px); /* Safari対応 */
      border-radius: 16px; /* 角をより丸く */
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    /* ポップアップの矢印は非表示に */
    .leaflet-popup-tip-container {
      display: none;
    }
    
    /* ポップアップのレイアウト調整 */
    .popup-container {
      width: 280px; /* ポップアップの幅を少し広げる */
    }
    .popup-header {
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      margin-bottom: 12px;
    }
    .popup-header b {
      font-size: 1.1em;
      font-weight: 700;
      color: #1d1d1f;
    }
    .popup-body {
      display: flex;
      flex-direction: column;
      gap: 12px; /* 各フィールド間の余白 */
    }
    .popup-field {
      display: flex;
      flex-direction: column;
      gap: 4px; /* ラベルと入力欄の間の余白 */
    }
    .popup-field-group {
      display: flex;
      gap: 16px; /* チェックボックス間の余白 */
      align-items: center;
      flex-wrap: wrap;
    }
    .popup-buttons {
      margin-top: 16px;
      display: flex;
      justify-content: flex-end; /* ボタンを右寄せに */
      flex-wrap: wrap; /* ボタンがコンテナに収まらない場合に折り返す */
      gap: 8px; /* ボタン間の余白 */
    }

    .popup-field label,
    .popup-field > span {
      color: #333; /* テキストの色を少し濃く */
    }

    /* ポップアップ内の入力欄のスタイル調整 */
    .popup-body input, .popup-body textarea, .popup-body select {
      background-color: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(0, 0, 0, 0.1);
      border-radius: 6px;
      color: #333;
      width: 100%; /* 幅を100%に */
      box-sizing: border-box; /* paddingを含めて幅を計算 */
      padding: 8px;
    }
    .popup-body input:focus, .popup-body textarea:focus, .popup-body select:focus {
      background-color: white;
      border-color: #007aff;
      box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
      outline: none;
    }

    /* 編集モード時のカーソルスタイル */
    #map.marker-edit-mode,
    #map.boundary-draw-mode {
      cursor: crosshair;
    }

    /* マーカー編集モード時のボタンエリアのスタイル */
    #controls-container.marker-edit-mode-active {
      background-color: rgba(255, 193, 7, 0.4); /* 少し濃い黄色 */
      transition: background-color 0.3s ease;
    }

    /* 区域作成モード時のボタンエリアのスタイル */
    #controls-container.boundary-draw-mode-active {
      background-color: rgba(0, 123, 255, 0.3); /* 少し濃い青色 */
      transition: background-color 0.3s ease;
    }

    /* 右側のユーザー情報/管理者アイコンを右端に寄せる */
    #auth-container {
      margin-left: auto;
      /* 他の要素との間に少し余白を設ける */
      padding-left: 8px;
    }

    /* 管理者ページ - カード内のコンテンツのはみ出し防止 */
    .admin-card-body {
      overflow-wrap: break-word; /* 長い単語を折り返す */
    }
    .admin-textarea {
      width: 100%;
      box-sizing: border-box; /* paddingとborderを幅に含める */
      max-width: 100%; /* 親要素を超えないようにする */
      resize: vertical; /* 垂直方向のみリサイズ可能に */
    }

    /* 管理者ページ - ユーザーリストテーブル */
    .user-list-table {
      width: 100%;
      table-layout: fixed; /* 列幅を均等に近づける */
      margin-top: 16px;
    }
    .user-list-table td {
      word-break: break-all; /* 長い文字列を強制的に折り返す */
    }

    /* 管理者ページ - ステータス設定 */
    .status-setting-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .status-drag-handle {
      cursor: grab;
      color: #aaa;
    }
    .status-setting-row.dragging {
      opacity: 0.5;
      background: #f0f0f0;
    }
    .status-name-input {
      flex: 1; /* 残りのスペースをすべて使用 */
      min-width: 0; /* flexアイテムがコンテナ幅に応じて縮小できるようにする */
    }
    .status-icon-input {
      flex: 0 0 120px; /* 幅を120pxに固定 */
      min-width: 0; /* flexアイテムがコンテナ幅に応じて縮小できるようにする */
    }
    .status-color-input {
      flex: 0 0 40px; /* 幅を40pxに固定 */
      height: 30px;
      padding: 2px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .status-delete-button {
      background: none; border: none; color: #dc3545; cursor: pointer;
    }

    /* 絞り込みボタンがアクティブな時のスタイル */
    #filter-by-area-button.active {
      background-color: #007bff; /* 青色 */
      color: white;
    }
  </style>
  <style>
    /* 絞り込み中の区域ラベルのスタイル */
    .filtered-boundary-tooltip {
      color: #007bff; /* 青色 */
      font-weight: bold;
    }
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" onload="onGsiLoad()" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script async defer src="%VITE_GOOGLE_MAPS_API_URL%"></script>
</head>
<body>
  <div id="map"></div>

  <div id="top-bar">
    <div id="controls-container" class="leaflet-control leaflet-top leaflet-left">
      <button id="center-map-button" title="現在地に戻る" class="control-button"><i class="fa-solid fa-location-crosshairs"></i></button>
      <button id="filter-by-area-button" title="区域で絞り込み" class="control-button" style="display: none;"><i class="fa-solid fa-filter"></i></button>
      <button id="edit-mode-button" title="マーカー編集モード" class="control-button"><i class="fa-solid fa-house-flag"></i></button>
      <button id="boundary-draw-button" title="境界線描画モード" class="control-button"><i class="fa-solid fa-draw-polygon"></i></button>
      <button id="export-button" title="CSVエクスポート" class="control-button"><i class="fa-solid fa-file-csv"></i></button>
      <button id="reset-markers-in-area-button" title="区域内の家を未訪問にする" class="control-button" style="display: none;"><i class="fa-solid fa-arrows-rotate"></i></button>
      <button id="backup-button" title="全データバックアップ" class="control-button"><i class="fa-solid fa-file-zipper"></i></button>
      <button id="finish-drawing-button" title="描画完了" class="control-button" style="display: none;"><i class="fa-solid fa-check"></i></button> <!-- このボタンはJSで制御されるため変更なし -->
    </div>
    <div id="auth-container">
      <div id="user-profile-container" class="user-profile" style="display: none;">
        <img id="user-profile-pic" src="" alt="profile picture">
        <span id="user-profile-name"></span>
      </div>
    </div>
    <!-- 管理者ページへのリンクをauth-containerの外に移動 -->
    <a id="admin-page-link" href="/admin.html" class="admin-link" style="display: none;" title="管理者ページへ">
      <i class="fa-solid fa-user-shield"></i>
    </a>
  </div>
  <div id="current-address-display" style="position: absolute; bottom: 10px; left: 10px; z-index: 1000; background-color: rgba(255, 255, 255, 0.8); padding: 5px; border-radius: 3px; font-size: 12px;">
    地図中心の住所を取得中です...
  </div>

  <!-- 集合住宅編集パネル -->
  <div id="apartment-editor" class="apartment-editor-panel">
    <div class="apartment-editor-header">
      <div id="apartment-editor-resizer" class="panel-resizer"></div>
      <h3 id="apartment-editor-title"></h3>
    </div>
    <div id="apartment-editor-content" class="apartment-editor-content"></div>
    <div class="apartment-editor-footer">
      <button id="apartment-editor-save" class="editor-button editor-button-primary"><i class="fa-solid fa-save"></i> 保存</button>
      <button id="apartment-editor-close" class="editor-button editor-button-secondary"><i class="fa-solid fa-times"></i> 閉じる</button>
    </div>
  </div>

  <!-- エクスポート設定パネル -->
  <div id="export-panel" class="export-panel">
    <div class="export-panel-header">
      <div id="export-panel-resizer" class="panel-resizer"></div>
      <h3>CSVエクスポート設定</h3>
    </div>
    <div id="export-panel-content" class="export-panel-content">
      <div class="export-columns">
        <div class="form-group export-column">
          <label for="export-area-numbers">区域番号:</label>
          <select id="export-area-numbers" class="area-select-box" multiple></select>
        </div>
        <div class="form-group export-column">
          <label for="export-language">言語:</label>
          <select id="export-language"></select>
        </div>
        <div class="form-group export-column">
          <label>ステータス:</label>
          <div id="export-status" class="status-filter-group"></div>
        </div>
        <div class="form-group export-column">
          <label for="export-keyword">メモのキーワード:</label>
          <input type="text" id="export-keyword" placeholder="キーワードでメモを検索">
        </div>
      </div>
    </div>
    <div class="export-panel-footer">
      <button id="export-panel-run" class="editor-button editor-button-primary"><i class="fa-solid fa-download"></i> エクスポート</button>
      <button id="export-panel-close" class="editor-button editor-button-secondary"><i class="fa-solid fa-times"></i> 閉じる</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
