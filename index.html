<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>訪問活動サポート</title>
  <meta name="description" content="訪問活動をサポートするためのPWA">
  <meta name="theme-color" content="#ffffff">
  <link rel="apple-touch-icon" href="/pwa-192x192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="src/styles.css">
  <link rel="stylesheet" href="src/export-panel.css">
  <style>
    /* ポップアップボタンの共通スタイル */
    .popup-button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      margin: 2px;
      transition: background-color 0.2s;
    }
    .popup-button i {
      margin-right: 5px;
    }
    .popup-button:hover {
      opacity: 0.9;
    }
    /* ボタンの色定義 */
    .button-primary {
      background-color: #007bff; /* 青 */
    }
    .button-secondary {
      background-color: #6c757d; /* グレー */
    }
    .button-danger {
      background-color: #dc3545; /* 赤 */
    }
    .button-warning {
      background-color: #ffc107; /* 黄色 */
      color: #212529; /* 暗いテキスト色 */
    }

    /* 編集モード時のカーソルスタイル */
    #map.marker-edit-mode,
    #map.boundary-draw-mode {
      cursor: crosshair;
    }

    /* マーカー編集モード時のボタンエリアのスタイル */
    #controls-container.marker-edit-mode-active {
      background-color: rgba(255, 193, 7, 0.2); /* 薄い黄色 */
      border-radius: 5px;
      padding: 2px;
      transition: background-color 0.3s ease;
    }

    /* 区域作成モード時のボタンエリアのスタイル */
    #controls-container.boundary-draw-mode-active {
      background-color: rgba(0, 123, 255, 0.15); /* 薄い青色 */
      border-radius: 5px;
      padding: 2px;
      transition: background-color 0.3s ease;
    }

    /* 右側のユーザー情報/管理者アイコンを右端に寄せる */
    #auth-container {
      margin-left: auto;
      /* 他の要素との間に少し余白を設ける */
      padding-left: 8px;
    }
  </style>
  <style>
    /* 絞り込み中の区域ラベルのスタイル */
    .filtered-boundary-tooltip {
      color: #007bff; /* 青色 */
      font-weight: bold;
    }
  </style>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://accounts.google.com/gsi/client" onload="onGsiLoad()" async defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script async defer src="%VITE_GOOGLE_MAPS_API_URL%"></script>
</head>
<body>
  <div id="map"></div>

  <!-- 管理者ページ用のコンテナを追加 -->
  <div id="admin-page" style="display: none;">
    <div class="admin-header">
      <h1>管理者ページ</h1>
      <a href="#" class="admin-close-button"><i class="fa-solid fa-arrow-left"></i> 地図に戻る</a>
    </div>
    <div class="admin-content">
      <div class="admin-card">
        <div class="admin-card-header"><h2><i class="fa-solid fa-users"></i> ユーザー管理</h2></div>
        <div class="admin-card-body">
          <button id="load-users-button" class="control-button"><i class="fa-solid fa-sync"></i> ユーザーリストを読み込む</button>
          <div id="user-list-container"></div>
        </div>
      </div>
      <div class="admin-card">
        <div class="admin-card-header"><h2><i class="fa-solid fa-user-shield"></i> 管理者権限設定</h2></div>
        <div class="admin-card-body">
          <p>管理者として登録するユーザーのメールアドレスを1行に1つずつ入力してください。</p>
          <textarea id="admin-users-textarea" class="admin-textarea" rows="8"></textarea>
          <div class="admin-button-group">
            <button id="save-admins-button" class="control-button"><i class="fa-solid fa-save"></i> 保存</button>
          </div>
        </div>
      </div>
      <div class="admin-card">
        <div class="admin-card-header"><h2><i class="fa-solid fa-database"></i> データ復元</h2></div>
        <div class="admin-card-body">
          <p>バックアップファイル（.zip）を選択して、データを復元します。<br><strong>注意：現在のデータはすべて上書きされます。</strong></p>
          <input type="file" id="restore-file-input" class="restore-input" accept=".zip">
          <div class="admin-button-group">
            <button id="restore-button" class="control-button" disabled><i class="fa-solid fa-upload"></i> 復元を実行</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="top-bar">
    <div id="controls-container" class="leaflet-control leaflet-top leaflet-left">
      <button id="center-map-button" title="現在地に戻る" class="control-button"><i class="fa-solid fa-location-crosshairs"></i></button>
      <button id="filter-by-area-button" title="区域で絞り込み" class="control-button" style="display: none;"><i class="fa-solid fa-filter"></i></button>
      <button id="edit-mode-button" title="マーカー編集モード" class="control-button"><i class="fa-solid fa-house-flag"></i></button>
      <button id="boundary-draw-button" title="境界線描画モード" class="control-button"><i class="fa-solid fa-draw-polygon"></i></button>
      <button id="export-button" title="CSVエクスポート" class="control-button"><i class="fa-solid fa-file-csv"></i></button>
      <button id="reset-markers-in-area-button" title="区域内の家を未訪問にする" class="control-button" style="display: none;"><i class="fa-solid fa-arrows-rotate"></i></button>
      <button id="backup-button" title="全データバックアップ" class="control-button"><i class="fa-solid fa-file-zipper"></i></button>
      <button id="finish-drawing-button" title="描画完了" class="control-button" style="display: none;"><i class="fa-solid fa-check"></i></button> <!-- このボタンはJSで制御されるため変更なし -->
    </div>
    <div id="auth-container">
      <div id="user-profile-container" class="user-profile" style="display: none;">
        <img id="user-profile-pic" src="" alt="profile picture">
        <span id="user-profile-name"></span>
      </div>
    </div>
    <!-- 管理者ページへのリンクをauth-containerの外に移動 -->
    <a id="admin-page-link" href="/#/admin" class="admin-link" style="display: none;" title="管理者ページへ">
      <i class="fa-solid fa-user-shield"></i>
    </a>
  </div>
  <div id="current-address-display" style="position: absolute; bottom: 10px; left: 10px; z-index: 1000; background-color: rgba(255, 255, 255, 0.8); padding: 5px; border-radius: 3px; font-size: 12px;">
    地図中心の住所を取得中です...
  </div>

  <!-- 集合住宅編集パネル -->
  <div id="apartment-editor" class="apartment-editor-panel">
    <div class="apartment-editor-header">
      <div id="apartment-editor-resizer" class="panel-resizer"></div>
      <h3 id="apartment-editor-title"></h3>
    </div>
    <div id="apartment-editor-content" class="apartment-editor-content"></div>
    <div class="apartment-editor-footer">
      <button id="apartment-editor-close" class="editor-button editor-button-secondary"><i class="fa-solid fa-times"></i> 閉じる</button>
      <button id="apartment-editor-save" class="editor-button editor-button-primary"><i class="fa-solid fa-save"></i> 保存</button>
    </div>
  </div>

  <!-- エクスポート設定パネル -->
  <div id="export-panel" class="export-panel">
    <div class="export-panel-header">
      <div id="export-panel-resizer" class="panel-resizer"></div>
      <h3>CSVエクスポート設定</h3>
    </div>
    <div id="export-panel-content" class="export-panel-content">
      <div class="export-columns">
        <div class="form-group export-column">
          <label for="export-area-numbers">区域番号:</label>
          <select id="export-area-numbers" class="area-select-box" multiple></select>
        </div>
        <div class="form-group export-column">
          <label for="export-language">言語:</label>
          <select id="export-language"></select>
        </div>
        <div class="form-group export-column">
          <label>ステータス:</label>
          <div id="export-status" class="status-filter-group"></div>
        </div>
        <div class="form-group export-column">
          <label for="export-keyword">メモのキーワード:</label>
          <input type="text" id="export-keyword" placeholder="キーワードでメモを検索">
        </div>
      </div>
    </div>
    <div class="export-panel-footer">
      <button id="export-panel-close" class="editor-button editor-button-secondary"><i class="fa-solid fa-times"></i> 閉じる</button>
      <button id="export-panel-run" class="editor-button editor-button-primary"><i class="fa-solid fa-download"></i> エクスポート</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
